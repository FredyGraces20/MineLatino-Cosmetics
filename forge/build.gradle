plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
}

group = 'com.minelatino.cosmetics'
version = '0.1.0-alpha.20'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

def mcVersion = project.findProperty('mcVersion') ?: '1.21.4'
def props = new Properties()
file('../versions.properties').withInputStream { props.load(it) }
def forgeVersion = props.getProperty("${mcVersion}.forge.version") ?: '54.1.0'
layout.buildDirectory = layout.projectDirectory.dir("build/${mcVersion}")
if (!props.getProperty("${mcVersion}.forge.version")) {
    throw new GradleException("Forge is not configured for Minecraft ${mcVersion}")
}

base.archivesName = "minelatino-cosmetics-forge-${mcVersion}"
minecraft {
    mappings channel: 'official', version: mcVersion
    runs {
        configureEach { workingDir = layout.projectDirectory.dir('run') }
        register('client')
    }
}
repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}
dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${mcVersion}-${forgeVersion}")
    if (mcVersion == '1.21.11') {
        annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'
    }
}
def versionSrc = "../client-${mcVersion}"
def selectedClient = mcVersion != '1.21.4' && file(versionSrc).exists() ? versionSrc : '../client'
def versionForgeSrc = "src/main/java-${mcVersion}"
def selectedForgeSrc = file(versionForgeSrc).exists() ? versionForgeSrc : 'src/main/java'
sourceSets.main {
    java.setSrcDirs([selectedForgeSrc, '../common/src/main/java', "${selectedClient}/src/main/java"])
    java.exclude '**/mixin/**'
    resources.setSrcDirs(['src/main/resources', "${selectedClient}/src/main/resources"])
    resources.exclude 'minelatino_cosmetics.mixins.json'
    resources.exclude 'fabric.mod.json'
}
processResources {
    inputs.property 'version', project.version
    inputs.property 'mcVersion', mcVersion
    inputs.property 'forgeVersion', forgeVersion
    filesMatching('META-INF/mods.toml') {
        expand(version: project.version, mcVersion: mcVersion, forgeVersion: forgeVersion)
    }
}
