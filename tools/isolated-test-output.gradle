// Redirects Gradle build directory to C:/temp/ to avoid OneDrive file locking.
// Usage: .\gradlew.bat :fabric:build --init-script tools\isolated-test-output.gradle
def runId = System.currentTimeMillis().toString()
allprojects {
    def mcVersion = gradle.startParameter.projectProperties['mcVersion'] ?: '1.21.4'
    def projectName = project.path.replace(':', '_')
    layout.buildDirectory.set(file("C:/temp/cosmetics-build-${runId}/${mcVersion}/${projectName}"))
    tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
        binaryResultsDirectory.set(layout.buildDirectory.dir("isolated-tests/${runId}/binary"))
        reports.junitXml.outputLocation.set(layout.buildDirectory.dir("isolated-tests/${runId}/xml"))
        reports.html.outputLocation.set(layout.buildDirectory.dir("isolated-tests/${runId}/html"))
    }
}
